services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - ivi

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/ivi_trasporti
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: https://${DOMAIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ivi

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ivi

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/etc:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ivi

volumes:
  mongo_data:
  uploads:

networks:
  ivi:
    driver: bridge